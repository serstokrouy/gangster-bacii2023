        /* ── Slider ─────────────────────────────────────────── */

            position: relative;
            overflow: hidden;
            border-radius: 22px;
            box-shadow: 0 16px 30px rgba(17, 51, 63, 0.24);
            background: var(--paper);
            animation: float-up 0.9s ease-out both;
            /* Height controlled by aspect ratio */
            aspect-ratio: 4 / 3;
        }

        .slides-track {
            display: flex;
            height: 100%;
            transition: transform 0.65s cubic-bezier(0.77, 0, 0.18, 1);
            will-change: transform;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            position: relative;
            flex-shrink: 0;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .slide::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 26, 34, 0.35), rgba(10, 26, 34, 0.05));
            pointer-events: none;
        }

            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--sun), var(--coral));
            z-index: 10;
            border-radius: 0 3px 3px 0;
            transition: width 0.08s linear;
        }

            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.75);
            border: none;
            cursor: pointer;
            border-radius: 50%;
            width: 2.4rem;
            height: 2.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(16, 33, 43, 0.2);
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .slider-arrow:hover {
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 6px 20px rgba(16, 33, 43, 0.3);
            transform: translateY(-50%) scale(1.08);
        }

        .slider-arrow:active {
            transform: translateY(-50%) scale(0.96);
        }

        .slider-arrow svg {
            width: 1rem;
            height: 1rem;
            stroke: #0f3b4e;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .slider-arrow.prev { left: 0.7rem; }
        .slider-arrow.next { right: 0.7rem; }

        /* ── Dot indicators ─────────────────────────────────── */
        .slider-dots {
            position: absolute;
            bottom: 0.85rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 0.45rem;
            z-index: 10;
            padding: 0.4rem 0.65rem;
            background: rgba(255, 255, 255, 0.62);
            border-radius: 999px;
            border: 1px solid rgba(16, 33, 43, 0.18);

            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: rgba(16, 33, 43, 0.28);
            cursor: pointer;
            border: none;
            padding: 0;
            transition: transform 0.25s ease, background 0.25s ease, width 0.3s ease;
        }

        .slider-dot.active {
            background: #0f3b4e;
            width: 1.4rem;
            border-radius: 999px;
            transform: none;
        }

        .slider-dot:hover:not(.active) {
            background: rgba(16, 33, 43, 0.55);
            transform: scale(1.2);
        }

            .slider-arrow {

            .host-by{

            }
            .card-image img{
                

                box-shadow: 0 2px 6px rgba(103, 125, 138, 0.18);
            }
        }

        @media (max-width: 380px) {
            .slider-arrow { display: none; }
        }

        let progTimer = null;
        let progStart = null;
        let progElapsed = 0;
        let paused    = false;
        let animating = false;

        // ── Build dots ──────────────────────────────────────────
        const dots = slides.map((_, i) => {
            const dot = document.createElement('button');
            dot.className = 'slider-dot' + (i === 0 ? ' active' : '');
            dot.setAttribute('role', 'tab');
            dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
            dot.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
            dot.addEventListener('click', () => goTo(i));
            dotsWrap.appendChild(dot);
            return dot;
        });

        // ── Core navigation ─────────────────────────────────────
        function goTo(index, skipReset = false) {
            if (animating) return;
            animating = true;
            current = (index + total) % total;

            track.style.transform = `translateX(-${current * 100}%)`;

            // Update dots
            dots.forEach((d, i) => {
                d.classList.toggle('active', i === current);
                d.setAttribute('aria-selected', i === current ? 'true' : 'false');
            });

            // Update counter
            counter.textContent = `${current + 1} / ${total}`;

            // Reset progress bar
            if (!skipReset) resetProgress();

            setTimeout(() => { animating = false; }, TRANSITION_MS);
        }

        function next() { goTo(current + 1); }
        function prev() { goTo(current - 1); }

        // ── Progress bar ─────────────────────────────────────────
        function startProgress(elapsed = 0) {
            progElapsed = elapsed;
            progStart   = performance.now() - elapsed;
            animateProgress();
        }

        function animateProgress() {
            progTimer = requestAnimationFrame((now) => {
                const ratio = Math.min((now - progStart) / AUTO_INTERVAL, 1);
                progress.style.width = (ratio * 100) + '%';
                if (ratio < 1) {
                    animateProgress();
                }
            });
        }

        function pauseProgress() {
            if (progTimer) cancelAnimationFrame(progTimer);
            progElapsed = performance.now() - progStart;
        }

        function resumeProgress() {
            progStart = performance.now() - progElapsed;
            animateProgress();
        }

        function resetProgress() {
            if (progTimer) cancelAnimationFrame(progTimer);
            progress.style.width = '0%';
            startProgress(0);
        }

        // ── Auto-play ────────────────────────────────────────────
        function startAutoPlay() {
            stopAutoPlay();
            timer = setInterval(next, AUTO_INTERVAL);
            startProgress();
        }

        function stopAutoPlay() {
            if (timer) clearInterval(timer);
            timer = null;
            if (progTimer) cancelAnimationFrame(progTimer);
        }

        function pauseAutoPlay() {
            if (paused) return;
            paused = true;
            clearInterval(timer);
            pauseProgress();
        }

        function resumeAutoPlay() {
            if (!paused) return;
            paused = false;
            const remaining = AUTO_INTERVAL - progElapsed;
            timer = setTimeout(() => {
                next();
                startAutoPlay();
            }, remaining > 0 ? remaining : 0);
            resumeProgress();
        }

        // ── Arrow clicks ─────────────────────────────────────────
        nextBtn.addEventListener('click', () => { next(); resetProgress(); });
        prevBtn.addEventListener('click', () => { prev(); resetProgress(); });

        // ── Keyboard navigation ───────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft')  { prev(); resetProgress(); }
            if (e.key === 'ArrowRight') { next(); resetProgress(); }
        });

        // ── Hover pause ───────────────────────────────────────────
        if (PAUSE_ON_HOVER) {
            slider.addEventListener('mouseenter', pauseAutoPlay);
            slider.addEventListener('mouseleave', resumeAutoPlay);
            slider.addEventListener('focusin',    pauseAutoPlay);
            slider.addEventListener('focusout',   resumeAutoPlay);
        }

        // ── Touch / swipe support ────────────────────────────────
        let touchStartX = null;
        let touchStartY = null;

        slider.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            pauseAutoPlay();
        }, { passive: true });

        slider.addEventListener('touchend', (e) => {
            if (touchStartX === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            // Only treat as swipe if horizontal movement dominates
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                dx < 0 ? next() : prev();
                resetProgress();
            }
            touchStartX = null;
            touchStartY = null;
            resumeAutoPlay();
        }, { passive: true });

        // ── Drag support (mouse) ──────────────────────────────────
        let dragStartX = null;
        let isDragging = false;

        slider.addEventListener('mousedown', (e) => {
            dragStartX = e.clientX;
            isDragging = false;
            pauseAutoPlay();
        });

        window.addEventListener('mousemove', (e) => {
            if (dragStartX === null) return;
            if (Math.abs(e.clientX - dragStartX) > 5) isDragging = true;
        });

        window.addEventListener('mouseup', (e) => {
            if (dragStartX === null) return;
            const dx = e.clientX - dragStartX;
            if (isDragging && Math.abs(dx) > 50) {
                dx < 0 ? next() : prev();
                resetProgress();
            }
            dragStartX = null;
            isDragging = false;
            if (!paused) resumeAutoPlay();
        });

        // Prevent accidental link/image navigation on drag
        slider.addEventListener('click', (e) => {
            if (isDragging) e.preventDefault();
        });

        // ── Visibility API — pause when tab hidden ────────────────
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        });

        // ── Init ─────────────────────────────────────────────────
        goTo(0, true);
        startAutoPlay();
    })();
    </script>
</body>
</html>
